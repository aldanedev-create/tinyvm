
name: Build TinyVM Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Allow GitHub Actions to push wheel files.
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: tinyvm-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  push-wheels:
    name: Push wheels to GitHub
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: tinyvm-wheels-*
          path: dist/wheels
          merge-multiple: true

      - name: Display generated wheels
        run: ls -lh dist/wheels/

      - name: Commit and push wheels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/wheels/*.whl

          if git diff --cached --quiet; then
            echo "No wheel changes to commit."
            exit 0
          fi

          git commit -m "Add TinyVM platform wheels"
          git push origin HEAD:${{ github.event.repository.default_branch }}
